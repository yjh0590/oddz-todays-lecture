<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 강의</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 780px;
      height: 640px;
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f8ff;
      color: #1d2a3a;
    }
    button, select { font: inherit; }
    .shell {
      height: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand { margin: 0; font-size: 24px; font-weight: 850; color: #173f84; }
    .subtitle { margin-top: 4px; font-size: 12px; color: #6c7d94; }
    .badge {
      padding: 7px 10px;
      border-radius: 999px;
      background: #e8f0ff;
      color: #2459ad;
      font-weight: 800;
      font-size: 12px;
    }

    .course-step {
      background: #fff;
      border: 1px solid #dbe6f5;
      border-radius: 16px;
      padding: 13px;
      box-shadow: 0 4px 16px rgba(23, 58, 110, 0.05);
    }
    .step-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }
    .step-num {
      width: 23px;
      height: 23px;
      border-radius: 8px;
      background: #2366d1;
      color: white;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }
    .step-title { font-size: 14px; font-weight: 800; }
    .course-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }
    select {
      width: 100%;
      height: 40px;
      border: 1px solid #cfd9e8;
      border-radius: 10px;
      padding: 0 11px;
      background: #fff;
      color: #22324a;
    }

    .panes {
      min-height: 0;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .panel {
      min-height: 0;
      background: #fff;
      border: 1px solid #dbe6f5;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(23, 58, 110, 0.05);
    }
    .panel-head {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #edf1f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title { font-size: 14px; font-weight: 800; }
    .count { font-size: 12px; color: #6d7d93; }
    .list { min-height: 0; flex: 1; overflow-y: auto; padding: 9px; }

    .lecture-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      border: 1px solid #e5eaf2;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      cursor: pointer;
      background: #fff;
    }
    .lecture-row:hover { background: #f8fbff; border-color: #aec7ef; }
    .lecture-row input { margin-top: 3px; accent-color: #2366d1; }
    .lecture-title, .queue-title { font-size: 13px; font-weight: 750; line-height: 1.35; }
    .lecture-meta, .queue-course { margin-top: 4px; font-size: 11px; color: #718198; }

    .queue-row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid #e5eaf2;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .queue-num {
      width: 24px; height: 24px; border-radius: 8px;
      display: grid; place-items: center;
      background: #edf4ff; color: #2559aa;
      font-size: 11px; font-weight: 800;
    }
    .remove {
      border: 0; background: transparent; color: #8b97a8;
      cursor: pointer; border-radius: 7px; padding: 4px 6px;
    }
    .remove:hover { background: #f2f4f7; color: #d34848; }

    .empty {
      padding: 24px 16px;
      text-align: center;
      color: #8a98ab;
      font-size: 12px;
      line-height: 1.6;
    }
    .panel-foot {
      border-top: 1px solid #edf1f7;
      padding: 9px;
      background: #fbfcff;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      min-height: 40px;
      padding: 0 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-open { background: #e8f0ff; color: #2357a4; }
    .btn-secondary { width: 100%; background: #eaf1fb; color: #244b83; }
    .btn-primary { background: #2366d1; color: #fff; }
    .btn-stop { background: #eef1f5; color: #4d5a6c; }

    .bottom {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 9px;
      align-items: center;
    }
    .status {
      min-width: 0;
      font-size: 12px;
      color: #65758c;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .playing { color: #1c7a46; font-weight: 750; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <h1 class="brand">오늘의 강의</h1>
        <div class="subtitle">대시보드에서 과목을 고르고, 들을 영상을 오늘 목록에 담아두세요.</div>
      </div>
      <div class="badge">가톨릭대 LMS</div>
    </div>

    <section class="course-step">
      <div class="step-head">
        <div class="step-num">1</div>
        <div class="step-title">과목 선택</div>
      </div>
      <div class="course-controls">
        <select id="courseSelect">
          <option value="">과목 목록을 불러오는 중...</option>
        </select>
        <button id="openCourse" class="btn btn-open">강의/출결 열기</button>
      </div>
    </section>

    <div class="panes">
      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">2. 영상 선택</div>
          <div id="lectureCount" class="count">0개</div>
        </div>
        <div id="lectureList" class="list">
          <div class="empty">과목의 강의/출결 화면을 열면 영상 목록이 나타납니다.</div>
        </div>
        <div class="panel-foot">
          <button id="addSelected" class="btn btn-secondary">선택한 강의를 오늘 목록에 추가</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">3. 오늘 재생할 목록</div>
          <div id="queueCount" class="count">0개</div>
        </div>
        <div id="queueList" class="list">
          <div class="empty">선택한 강의를 여기에 모을 수 있습니다.<br>과목이 달라도 함께 담을 수 있습니다.</div>
        </div>
      </section>
    </div>

    <div class="bottom">
      <div id="status" class="status">준비 중</div>
      <button id="stop" class="btn btn-stop">중지</button>
      <button id="start" class="btn btn-primary">전체 시작</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
